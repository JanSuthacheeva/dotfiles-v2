#--------------------------------------------------------------------------
# Configuration
#--------------------------------------------------------------------------

source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

# Use Vi mode
setw -g mode-keys vi

set -g history-limit 10000
# Increase scrollback buffer size

# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

# Keep manual window names — don't let processes or escape sequences override
set -g allow-rename off
set -g automatic-rename off

# Renumber windows when one is removed.
set -g renumber-windows on

# Improve colors
set -g default-terminal "${TERM}"
set -as terminal-features ',*:RGB'


# Allow the mouse to resize windows and select tabs
set -g mouse on

# Allow tmux to set the terminal title
set -g set-titles on
set -g set-titles-string '#h:#W'

# don't detach tmux when killing a session
set -g detach-on-destroy off

set -g status-position top
set -g status 2
set -g 'status-format[1]' ''

# set -g pane-active-border-style 'fg=#d8ab2e,bg=default'
# set -g pane-border-style 'fg=#383f49,bg=default'

##--------------------------------------------------------------------------
## Claude
##--------------------------------------------------------------------------

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

##--------------------------------------------------------------------------
## Keybinding
##--------------------------------------------------------------------------

unbind-key C-b
set-option -g prefix C-a

# Sessionizer: prefix + f -> fzf-pick a project, create/switch its session (scripts/t)
bind-key -r f run-shell "tmux neww t"

##--------------------------------------------------------------------------
## Plugins
##--------------------------------------------------------------------------
## Disabled for now

# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'JanSuthacheeva/tmux-agent-status'

##--------------------------------------------------------------------------
## Theme palette (follows the active Noctalia theme)
##--------------------------------------------------------------------------
source-file -q ~/.config/tmux/themes/palette.conf

##--------------------------------------------------------------------------
## Status bar (custom, tab-style, multi-agent aware)
##--------------------------------------------------------------------------
set -g status-justify left
set -g status-interval 2
set -g status-left-length 100
set -g status-right-length 100

set-hook -g session-created 'set status-style "bg=default"'

set -g @sess_color "#{?client_prefix,#{@noctalia_on_surface_variant},#{@noctalia_primary}}"
set -g status-left "#[fg=#{@noctalia_on_primary},bg=#{E:@sess_color},bold] #S #[fg=#{E:@sess_color},bg=default,nobold] "
set -g status-right "#{agent_summary}"
set -g @agent_status_working_color "#{@noctalia_on_tertiary_container}"
set -g @agent_status_waiting_color "#{@noctalia_primary}"
set -g @agent_status_idle_color "#{@noctalia_outline}"


set -gw window-status-separator " "
set -gw window-status-current-format "#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary},bold] #{agent_glyph}#I #W#{?window_zoomed_flag, ,} #[fg=#{@noctalia_primary},bg=default,nobold]"
set -gw window-status-format         "#[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container_high}] #{agent_dot}#[fg=#{@noctalia_on_surface_variant}]#I #W #[fg=#{@noctalia_surface_container_high},bg=default]"

setw -g window-style 'bg=default'
setw -g window-active-style 'bg=default'

##--------------------------------------------------------------------------
## Plugin load
##--------------------------------------------------------------------------
run '~/.config/tmux/plugins/tpm/tpm'
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"

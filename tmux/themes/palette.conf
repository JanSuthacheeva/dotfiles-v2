#--------------------------------------------------------------------------
# Palette wrapper (Noctalia)
#--------------------------------------------------------------------------
# Sources the Noctalia-generated palette, then undoes the styles it sets that
# the custom status bar in tmux.conf owns.
#
# Why a wrapper: Noctalia's community tmux template runs apply.sh on every
# theme change, which deletes any `source-file` line mentioning
# tmux/themes/noctalia.conf from tmux.conf and re-appends it at the very
# bottom. Sourcing through this file keeps the palette where the bar needs it
# (before the bar) - apply.sh only rewrites tmux.conf, never this file.

source-file -q ~/.config/tmux/themes/noctalia.conf

# Transparent bar (the generated file sets an opaque surface_container_low bg).
set -gF status-style "bg=default,fg=#{@noctalia_on_surface}"

# The window pill formats paint every cell explicitly, so the window styles
# would only bleed through as colored gaps.
set -gw window-status-style "default"
set -gw window-status-current-style "default"
